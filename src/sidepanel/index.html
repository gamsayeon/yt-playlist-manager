<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT Playlist Manager</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <h1>YT Playlist Manager</h1>

      <div id="login-view" class="hidden">
        <button id="login-btn">Google 계정으로 로그인</button>
      </div>

      <div id="main-view" class="hidden">
        <div id="header-section">
          <p id="user-info"></p>
          <button id="logout-btn">로그아웃</button>
        </div>

        <!-- 임시 리스트 영역 -->
        <div id="temp-section">
          <div id="temp-list-container"></div>

          <!-- 재생목록 생성 폼 -->
          <div id="create-playlist-form">
            <h2 class="form-title">재생목록 생성</h2>

            <div class="form-field">
              <label class="form-label" for="playlist-title">제목 <span class="form-required">*</span></label>
              <input
                type="text"
                id="playlist-title"
                class="form-input"
                placeholder="재생목록 제목을 입력하세요"
                maxlength="150"
              />
            </div>

            <div class="form-field">
              <label class="form-label" for="playlist-description">설명</label>
              <textarea
                id="playlist-description"
                class="form-textarea"
                placeholder="재생목록 설명을 입력하세요 (선택)"
                maxlength="5000"
                rows="3"
              ></textarea>
            </div>

            <div class="form-field">
              <label class="form-label" for="playlist-privacy">공개 여부</label>
              <select id="playlist-privacy" class="form-select">
                <option value="public">공개</option>
                <option value="unlisted">미등록</option>
                <option value="private" selected>비공개</option>
              </select>
            </div>

            <button id="create-playlist-btn" class="create-playlist-btn" disabled>
              재생목록 생성
            </button>
          </div>
        </div>

        <!-- 드래그 구분선 -->
        <div id="divider"></div>

        <!-- 재생목록 목록 영역 -->
        <div id="playlist-section">
          <div class="playlist-section-header">
            <h2 class="form-title">내 재생목록</h2>
            <button id="refresh-playlists-btn" class="refresh-btn" title="새로고침">↺</button>
          </div>
          <div id="playlist-list-container"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
