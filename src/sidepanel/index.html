<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT Playlist Manager</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <h1>YT Playlist Manager</h1>

      <div id="login-view" class="hidden">
        <button id="login-btn">Google 계정으로 로그인</button>
      </div>

      <div id="main-view" class="hidden">
        <div id="header-section">
          <p id="user-info"></p>
          <button id="logout-btn">로그아웃</button>
        </div>

        <!-- 임시 리스트 / 재생목록 영상 목록 (같은 공간) -->
        <div id="temp-section">

          <!-- 임시 리스트 모드 -->
          <div id="temp-list-mode">
            <div id="temp-list-container"></div>
          </div>

          <!-- 재생목록 수정 모드 -->
          <div id="playlist-edit-mode" class="hidden">
            <div id="playlist-edit-header">
              <button id="back-btn" class="back-btn">← 뒤로</button>
              <p id="playlist-edit-title" class="playlist-edit-title"></p>
            </div>
            <div id="playlist-items-container"></div>
          </div>

          <!-- 생성/수정 폼 -->
          <div id="playlist-form">
            <h2 id="form-title-text" class="form-title">재생목록 생성</h2>

            <div class="form-field">
              <label class="form-label" for="playlist-title">제목 <span class="form-required">*</span></label>
              <input
                type="text"
                id="playlist-title"
                class="form-input"
                placeholder="재생목록 제목을 입력하세요"
                maxlength="150"
              />
            </div>

            <div class="form-field">
              <label class="form-label" for="playlist-description">설명</label>
              <textarea
                id="playlist-description"
                class="form-textarea"
                placeholder="재생목록 설명을 입력하세요 (선택)"
                maxlength="5000"
                rows="3"
              ></textarea>
            </div>

            <div class="form-field">
              <label class="form-label" for="playlist-privacy">공개 여부</label>
              <select id="playlist-privacy" class="form-select">
                <option value="public">공개</option>
                <option value="unlisted">미등록</option>
                <option value="private" selected>비공개</option>
              </select>
            </div>

            <button id="submit-playlist-btn" class="create-playlist-btn" disabled>
              재생목록 생성
            </button>
          </div>
        </div>

        <!-- 드래그 구분선 -->
        <div id="divider"></div>

        <!-- 재생목록 목록 영역 -->
        <div id="playlist-section">
          <div class="playlist-section-header">
            <h2 class="form-title">내 재생목록</h2>
            <div class="playlist-controls">
              <!-- 정렬 드롭다운 -->
              <div class="dropdown-wrapper">
                <button id="sort-btn" class="control-btn">정렬 ▾</button>
                <ul id="sort-dropdown" class="dropdown-list hidden">
                  <li data-sort="date-desc">최신 생성순</li>
                  <li data-sort="date-asc">오래된 생성순</li>
                  <li data-sort="title-asc">제목 가나다순</li>
                  <li data-sort="title-desc">제목 역순</li>
                  <li data-sort="count-desc">영상 많은 순</li>
                  <li data-sort="count-asc">영상 적은 순</li>
                </ul>
              </div>
              <!-- 필터 드롭다운 -->
              <div class="dropdown-wrapper">
                <button id="filter-btn" class="control-btn">필터 ▾</button>
                <ul id="filter-dropdown" class="dropdown-list hidden">
                  <li data-filter="all">전체</li>
                  <li data-filter="public">공개만</li>
                  <li data-filter="private">비공개만</li>
                </ul>
              </div>
              <button id="refresh-playlists-btn" class="refresh-btn" title="새로고침">↺</button>
            </div>
          </div>
          <div id="playlist-list-container"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
